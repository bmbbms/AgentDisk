services:
  mysql:
    image: mysql:8.0
    container_name: agentdisk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-agentdisk123}
      MYSQL_DATABASE: agentdisk
      MYSQL_USER: agentdisk
      MYSQL_PASSWORD: ${DB_PASSWORD:-agentdisk123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-agentdisk123}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: agentdisk-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OSS_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OSS_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "${OSS_ACCESS_KEY:-minioadmin}" "${OSS_SECRET_KEY:-minioadmin}"
        mc mb --ignore-existing local/agentdisk
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: agentdisk-redis
    ports:
      - "6379:6379"
    profiles:
      - redis

  agentdisk:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: agentdisk-backend
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-agentdisk123}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:-minioadmin}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:-minioadmin}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-for-testing-only}
      DL_TOKEN_SECRET: ${DL_TOKEN_SECRET:-dev-dl-token-secret-for-testing}
    ports:
      - "9100:9100"
    volumes:
      - ./config.compose.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  gateway:
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    container_name: agentdisk-gateway
    depends_on:
      agentdisk:
        condition: service_healthy
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/api/users"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    container_name: agentdisk-web
    depends_on:
      agentdisk:
        condition: service_healthy
      gateway:
        condition: service_healthy
    environment:
      VITE_PROXY_TARGET: http://agentdisk:9100
    ports:
      - "9101:9101"

volumes:
  mysql_data:
  minio_data:
